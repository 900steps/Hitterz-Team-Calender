<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Team Calendar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1 id="login-title">Team Calendar</h1>
      <label>Username<input name="username" autocomplete="username" required autocapitalize="none" /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="error" id="login-error"></p>
    </form>
  </section>

  <!-- App -->
  <section id="app-view" hidden>
    <header class="topbar">
      <div class="brand" id="brand">Team Calendar</div>
      <nav class="tabs" id="tabs">
        <button data-tab="calendar" class="active">Calendar</button>
        <button data-tab="chat">Message board</button>
        <button data-tab="tasks">Tasks</button>
        <button data-tab="members" data-admin hidden>Members</button>
        <button data-tab="audit" data-admin hidden>Activity log</button>
        <button data-tab="me">Me</button>
      </nav>
    </header>

    <main>
      <!-- Calendar -->
      <div class="tab-panel" id="tab-calendar">
        <div class="cal-toolbar">
          <div class="nav-group">
            <button class="btn icon" id="cal-prev" aria-label="Previous">‹</button>
            <button class="btn" id="cal-today">Today</button>
            <button class="btn icon" id="cal-next" aria-label="Next">›</button>
          </div>
          <h2 id="cal-title"></h2>
          <div class="seg" id="cal-mode">
            <button data-mode="month" class="active">Month</button>
            <button data-mode="week">Week</button>
            <button data-mode="day">Day</button>
          </div>
        </div>
        <p class="hint" id="cal-hint"></p>
        <div id="cal-body"></div>
      </div>

      <!-- Chat -->
      <div class="tab-panel" id="tab-chat" hidden>
        <div class="chat card">
          <div class="chat-list" id="chat-list"></div>
          <form class="chat-form" id="chat-form">
            <textarea name="body" rows="1" maxlength="2000" placeholder="Type a message… (Enter to send, Shift+Enter for new line)" required></textarea>
            <button class="btn primary" type="submit">Send</button>
          </form>
        </div>
      </div>

      <!-- Tasks -->
      <div class="tab-panel" id="tab-tasks" hidden>
        <div class="panel-head">
          <h2>Assignments</h2>
          <button class="btn primary" id="task-new" data-admin hidden>+ New task</button>
        </div>
        <div id="task-list"></div>
      </div>

      <!-- Members (admin) -->
      <div class="tab-panel" id="tab-members" hidden>
        <div class="panel-head"><h2>Members</h2></div>
        <form class="card form-grid" id="member-form">
          <h3>Create account</h3>
          <label>Username<input name="username" required pattern="[a-z0-9][a-z0-9_.\-]{1,30}[a-z0-9]" title="3–32 lowercase letters, digits, or . _ -" autocapitalize="none" /></label>
          <label>Initial password<input name="password" required minlength="8" /></label>
          <label id="member-role-wrap" hidden>Role
            <select name="role"><option value="member">Member</option><option value="admin">Admin</option></select>
          </label>
          <button class="btn primary" type="submit">Create</button>
          <p class="error" id="member-error"></p>
        </form>
        <div id="member-list"></div>
      </div>

      <!-- Audit (admin) -->
      <div class="tab-panel" id="tab-audit" hidden>
        <div class="panel-head">
          <h2>Activity log</h2>
          <select id="audit-filter"><option value="">All members</option></select>
        </div>
        <p class="hint">Keeps the last 3 months of activity.</p>
        <div id="audit-list"></div>
      </div>

      <!-- Me -->
      <div class="tab-panel" id="tab-me" hidden>
        <form class="card form-grid" id="profile-form">
          <h3>My profile</h3>
          <p class="muted">Username: <b id="me-username"></b> · Role: <span id="me-role"></span></p>
          <label>Display name<input name="display_name" required maxlength="40" /></label>
          <button class="btn primary" type="submit">Save</button>
          <p class="ok" id="profile-msg"></p>
        </form>
        <form class="card form-grid" id="password-form">
          <h3>Change password</h3>
          <label>New password<input name="password" type="password" minlength="8" required autocomplete="new-password" /></label>
          <button class="btn" type="submit">Change password</button>
          <p class="ok" id="password-msg"></p>
        </form>
        <button class="btn danger" id="logout">Sign out</button>
      </div>
    </main>
  </section>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
